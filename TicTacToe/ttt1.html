<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
                padding-top: 100px;
            }
            .row {
                display: flex;
                justify-content: center;
                height: 75px;
            }

            .box {
                border: 1px solid black;
                padding: 10px;
                width: 75px;
                font-size: 50px;
                text-align: center;
            }

            .box:hover {
                box-shadow: 0 10px 20px rgba(0,0,0,0.2);
                background-color: rgb(247, 184, 9);
            }


        </style>
    </head>
    <body>
        <div class="row">
            <div class="box"> X </div>
            <div class="box"></div>
            <div class="box"></div>
        </div>

        <div class="row">
            <div class="box"></div>
            <div class="box"> X </div>
            <div class="box"></div>
        </div>

        <div class="row">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"> O </div>
        </div>

    </body>

</html>
