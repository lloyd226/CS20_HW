<!DOCTYPE html>
<html>
    <head>
        <style>

            .title {
                text-align: center;
            }

            .grid {
                display: grid;
                justify-content: center;
                grid-template-columns: 100px 100px 100px;
                
            }

            .square {
                border: 1px solid black;
                padding: 10px;
                width: 75px;
                height: 75px;
                font-size: 50px;
                text-align: center;
            }

            .square:hover {
                box-shadow: 0 10px 20px rgba(0,0,0,0.2);
                background-color: rgb(247, 184, 9);
            }

            .turn {
                border: 2px solid black;
                text-align: center;
                width: fit-content;
                margin: 0 auto;
            }
            
            .winner{
                border: 2px solid black;
                text-align: center;
                margin: 0 auto;
                width: fit-content;
            }

            .start {
                background-color: #00FF00;
                margin-top: 50px;
                text-align: center;
                margin-left: 50%;
                width: 75px;
            }

            .start:hover {
                box-shadow: 0 10px 20px rgba(0,0,0,0.2);
                background-color: #006400;
            }
        </style>
    </head>
    <body>
        <h1 class="title"> Tic Tac Toe</h1>
        <div class="turn"id="turn">
            <script>
                var random_num = Math.round(Math.random() + 1);
                var playerTurn;

                if (random_num == 1){
                    playerTurn = "X";
                } else {
                    playerTurn = "O";
                }

                document.write("Player " + playerTurn + " Turn");
            </script>
        </div>
        <div class="grid">
            <script>
                const NUM_SQUARES = 9;
                var moves = ["-","-","-","-","-","-","-","-","-"];
                var won = false;
                var box = null;

                for (let i=0; i < NUM_SQUARES; i++)
                {
                    id = "sq" + i;
                    document.write("<div class='square' id='" + id + "'></div>");
                };
                
                moves.forEach((move, i) => {
                    box = document.getElementById("sq" + i);
                    box.addEventListener("click", function() {
                        if (moves[i] == "-"){
                            this.textContent = playerTurn;
                            moves[i] = playerTurn
                            if (playerTurn == "X") {
                                playerTurn = "O";
                                
                            } else {
                                playerTurn = "X";
                            };
                            document.getElementById("turn").textContent = "Player " + playerTurn + " Turn";
                            
                            if (winTest(moves)) {
                                moves = [1,1,1,1,1,1,1,1,1];
                                document.getElementById("start").textContent = "Restart Game";
                            }
                            
                        };  
                        

                    });
                });

                
                

            </script>
        </div>

        <div class="winner" id="winnerTxt">
            The Winner is ___
        </div>
        <div class="start" id="start">
            Start Game
        </div>

        <script>
                currdiv = document.getElementById("start");
                currdiv.addEventListener("click", function() {
                    resetBoard();
                });

                function resetBoard() {
                    moves.forEach((move, i) => {
                        moves[i] = "-";
                        document.getElementById("sq" + i).textContent = "";
                    });

                    random_num = Math.round(Math.random() + 1);
                    if (random_num == 1){
                        playerTurn = "X";
                    } else {
                        playerTurn = "O";
                    };
                    document.getElementById("turn").textContent = "Player " + playerTurn + " Turn";
                    document.getElementById("start").textContent = "Start Game";
                };

                function winTest(moves) { 
                    var winner = "";
                    var stalemate = true;
                    var winConditions = [
                        moves[0] + moves[1] + moves[2],
                        moves[3] + moves[4] + moves[5],
                        moves[6] + moves[7] + moves[8],
                        moves[0] + moves[3] + moves[6],
                        moves[1] + moves[4] + moves[7],
                        moves[2] + moves[5] + moves[8],
                        moves[0] + moves[4] + moves[8],
                        moves[6] + moves[4] + moves[2]
                    ];

                    winConditions.forEach(line => {
                        if (line == "XXX") {
                            winner = "X"
                        } else if (line == "OOO"){
                            winner = "O"
                        }
                        if(line.includes("-")) {
                            stalemate = false;
                        }
                    });
                    
                    if (winner != "") {
                        document.getElementById("winnerTxt").textContent = "Player " + winner + " has won!";
                        return true;
                    } else if (stalemate) {
                        document.getElementById("winnerTxt").textContent = "Stalemate";
                        return true;
                    } 
                    return false;
                };

            </script>

    </body>
</html>
